[project]
name = "navis"
version = "0.1.0"
description = "Run several coding agents on separate, sandboxed tasks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
navis = "navis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["navis"]
