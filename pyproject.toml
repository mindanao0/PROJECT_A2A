[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navis-control"
version = "0.1.0"
description = "Local Navis control GUI with a deterministic simulated agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
navis = "navis.__main__:main"

[tool.setuptools.package-data]
navis = ["web/*.html", "web/*.css", "web/*.js"]

[tool.setuptools.packages.find]
include = ["navis*"]
